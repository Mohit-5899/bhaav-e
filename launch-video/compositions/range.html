<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      container-type: size;
    }
    #range-ground {
      position: absolute;
      inset: 0;
      background: var(--peach);
    }
    #range-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .range-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8cqh;
      text-align: center;
      color: var(--ink);
      font-weight: 900;
      font-size: 5.2cqmin;
      letter-spacing: -0.02em;
      opacity: 0;
    }
    .range-line b {
      color: var(--orange);
    }
    #range-dip {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
    }
  </style>
  <div data-hf-id="hf-jdt8" id="root" data-composition-id="range" data-width="1920" data-height="1080">
    <div data-hf-id="hf-smic" id="range-ground"></div>
    <canvas data-hf-id="hf-6czi" id="range-canvas"></canvas>
    <div data-hf-id="hf-qxh6" id="range-l1" class="range-line">30 subjects · 12 effects · 9 motions</div>
    <div data-hf-id="hf-9y6v" id="range-l2" class="range-line">Even pairings it <b data-hf-id="hf-s2k4">never saw</b> in training</div>
    <div data-hf-id="hf-qv6k" id="range-dip"></div>
  </div>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js";

    const canvas = document.getElementById("range-canvas");
    const root = canvas.parentElement;
    const W = root.clientWidth || 1920, H = root.clientHeight || 1080;
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H, false);
    renderer.setClearColor(0x000000, 0);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
    const FIT = 1 / (0.62 * 2 * Math.tan((16 * Math.PI) / 180));   // distance where one sticker fills 62% of the frame height

    // heavy setup (8 textures) is a build promise; the timeline registers at the end of it
    window.__hf = window.__hf || {};
    window.__hf.buildReady = window.__hf.buildReady || {};
    let resolveReady;
    window.__hf.buildReady["range"] = new Promise((r) => (resolveReady = r));

    const loader = new THREE.TextureLoader();
    const textures = await Promise.all(
      [0, 1, 2, 3, 4, 5, 6, 7].map((i) => loader.loadAsync("assets/stickers/s" + i + ".png")),
    );
    const wall = new THREE.Group();
    scene.add(wall);
    const GAP = 1.25;
    const planes = textures.map((tex, i) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.repeat.set(0.25, 0.25);
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: tex }));
      mesh.position.set(i * GAP, 0, 0);
      wall.add(mesh);
      return mesh;
    });

    const io = gsap.parseEase("power2.inOut");
    const seg = (s, a, b) => Math.min(1, Math.max(0, (s - a) / (b - a)));
    const mix = (a, b, t) => a + (b - a) * t;
    function renderAt(s) {
      // every sticker plays its own 8 fps loop from global time, offset so they do not move in lockstep
      const g = s + 15.5;
      planes.forEach((m, i) => {
        const k = (Math.floor(g * 8) + i * 3) % 16;
        m.material.map.offset.set((k % 4) * 0.25, 0.75 - Math.floor(k / 4) * 0.25);
      });
      // A 0.3-1.9: pull back from the first sticker to an angled view along the wall;
      // B 1.9-5.5: dolly along the wall at that angle. The wall stays flat; the camera's angle tilts it.
      const a = io(seg(s, 0.3, 1.9)), b = io(seg(s, 1.9, 5.5));
      const cx = mix(mix(0, 0.3, a), 6.1, b), cy = mix(0, 0.3, a), cz = mix(FIT, 3.7, a);
      const lx = mix(mix(0, 1.9, a), 7.7, b), ly = mix(0, -0.12, a);
      camera.position.set(cx, cy, cz);
      camera.lookAt(lx, ly, 0);
      renderer.render(scene, camera);
    }

    const clock = { s: 0 };
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(clock, { s: 0 }, { s: 5.5, duration: 5.5, ease: "none", onUpdate: () => renderAt(clock.s) }, 0);
    // colour flood: the sticker stays put while the world changes from navy to peach
    tl.fromTo("#range-ground", { backgroundColor: "#1d2843" }, { backgroundColor: "#fde0c6", duration: 0.4, ease: "power2.inOut" }, 0.05);
    tl.fromTo("#range-l1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0.9);
    tl.to("#range-l1", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, 2.85);
    tl.fromTo("#range-l2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 3.0);
    // dip cut: darken for three frames before the hard cut to the numbers
    tl.fromTo("#range-dip", { opacity: 0 }, { opacity: 0.4, duration: 0.1, ease: "none" }, 5.4);
    renderAt(0);
    window.__timelines["range"] = tl;
    resolveReady();
  </script>
</template>
