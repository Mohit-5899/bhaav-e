<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      background: var(--navy);
      overflow: hidden;
      container-type: size;
    }
    #how-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #how-real {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 62cqmin;
      height: 62cqmin;
      margin: -31cqmin 0 0 -31cqmin;
      border-radius: 4cqmin;
      background-image: url(assets/stickers/s0.png);
      background-size: 400% 400%;
      opacity: 0;
    }
    .how-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 7cqh;
      text-align: center;
      color: #ffffff;
      font-weight: 700;
      font-size: max(3.4cqh, 26px);
      letter-spacing: -0.01em;
      opacity: 0;
    }
    .how-line b {
      color: #ff8a3d;
      font-weight: 900;
    }
    #how-eq {
      position: absolute;
      left: 0;
      right: 0;
      top: 6cqh;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-size: max(2.8cqh, 30px);
      color: rgba(255, 255, 255, 0.92);
      opacity: 0;
    }
    #how-step {
      position: absolute;
      right: 5cqw;
      top: 6cqh;
      font-family: "JetBrains Mono", monospace;
      font-size: max(2.6cqh, 24px);
      color: #ffffff;
      opacity: 0;
    }
    /* square frame: the step counter sits under the equation instead of beside it */
    @container (max-aspect-ratio: 5/4) {
      #how-step {
        left: 0;
        right: 0;
        top: 11.5cqh;
        text-align: center;
      }
    }
  </style>
  <div data-hf-id="hf-fe7r" id="root" data-composition-id="how" data-width="1920" data-height="1080">
    <canvas data-hf-id="hf-vvt9" id="how-canvas"></canvas>
    <div data-hf-id="hf-zv3a" id="how-real"></div>
    <div data-hf-id="hf-sx2n" id="how-eq">xₜ = (1 − t) · sticker + t · noise</div>
    <div data-hf-id="hf-07uc" id="how-step">step 0 / 50</div>
    <div data-hf-id="hf-wphj" id="how-l1" class="how-line">It starts as <b data-hf-id="hf-ffid">pure noise</b></div>
    <div data-hf-id="hf-t6ur" id="how-l2" class="how-line">A <b data-hf-id="hf-d6k5">212M</b>-parameter transformer removes it in <b data-hf-id="hf-waf7">50 steps</b></div>
    <div data-hf-id="hf-koxq" id="how-l3" class="how-line"><b data-hf-id="hf-q3kx">17 frames</b>, 256 px, looping</div>
  </div>
  <script src="assets/js/particles.js"></script>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js";

    const root = document.getElementById("how-canvas").parentElement;
    const W = root.clientWidth || 1920;
    const H = root.clientHeight || 1080;
    const canvas = document.getElementById("how-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W, H, false);
    renderer.setClearColor(0x1d2843, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
    const FIT = 4.0 / (0.62 * 2 * Math.tan((16 * Math.PI) / 180));   // distance where the sticker fills 62% of the frame height
    // in a square frame the vertical fov is also the short side, so FIT holds for both formats

    // seeded PRNG (mulberry32) and gaussian noise: the "noise" end of the path is fixed for every frame
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(7);
    const gauss = () => Math.sqrt(-2 * Math.log(rand() + 1e-9)) * Math.cos(2 * Math.PI * rand());

    const side = window.BHAAV_PARTICLES.side;
    const rgb = Uint8Array.from(atob(window.BHAAV_PARTICLES.rgb), (c) => c.charCodeAt(0));
    const N = side * side;
    const span = 4.0;                                   // world units across the sticker
    const target = new Float32Array(N * 3), noise = new Float32Array(N * 3);
    const cTarget = new Float32Array(N * 3), cNoise = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const x = i % side, y = Math.floor(i / side);
      target[i * 3] = (x / (side - 1) - 0.5) * span;
      target[i * 3 + 1] = (0.5 - y / (side - 1)) * span;
      target[i * 3 + 2] = 0;
      noise[i * 3] = gauss() * 1.7;
      noise[i * 3 + 1] = gauss() * 1.7;
      noise[i * 3 + 2] = gauss() * 1.7;
      // vertex colours are linear in three.js; convert from sRGB so the particles match the real sticker
      for (let k = 0; k < 3; k++) cTarget[i * 3 + k] = Math.pow(rgb[i * 3 + k] / 255, 2.2);
      const g = 0.35 + 0.5 * rand();
      cNoise[i * 3] = Math.pow(g * 0.75, 2.2); cNoise[i * 3 + 1] = Math.pow(g * 0.82, 2.2); cNoise[i * 3 + 2] = Math.pow(g, 2.2);
    }
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    // point size ~8 px at the final camera distance, so neighbouring points touch
    const mat = new THREE.PointsMaterial({ size: (span / side) * 4.0, vertexColors: true, sizeAttenuation: true });
    const points = new THREE.Points(geo, mat);
    scene.add(points);

    // everything in the 3D view is a pure function of scene time s (frames render out of order)
    const ease = { expo: gsap.parseEase("expo.out"), io: gsap.parseEase("power2.inOut") };
    const seg = (s, a, b) => Math.min(1, Math.max(0, (s - a) / (b - a)));
    const shift = (u) => (5 * u) / (1 + 4 * u);        // the real sampler schedule: time shift 5
    const stepEl = document.getElementById("how-step");
    const real = document.getElementById("how-real");
    function renderAt(s) {
      // 0.0-0.9 settle back from the zoom; 0.6-1.6 scatter to noise; 2.1-5.3 the 50 sampler steps
      let tau = 0, step = -1;
      if (s >= 0.6) tau = ease.io(seg(s, 0.6, 1.6));
      if (s >= 2.1) {
        const p = seg(s, 2.1, 5.3);
        tau = shift(1 - p);
        step = p * 50;
      }
      const cam = s < 2.1 ? FIT * 0.55 + FIT * 0.6 * ease.expo(seg(s, 0, 0.9)) : FIT * 1.15 - FIT * 0.15 * ease.io(seg(s, 2.1, 5.3));
      const spin = s < 2.1 ? 0.35 * ease.io(seg(s, 0.6, 1.6)) : 0.35 * (1 - ease.io(seg(s, 2.1, 5.3)));
      for (let i = 0; i < N * 3; i++) {
        pos[i] = (1 - tau) * target[i] + tau * noise[i];
        col[i] = (1 - tau) * cTarget[i] + tau * cNoise[i];
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.color.needsUpdate = true;
      points.rotation.y = spin;
      camera.position.set(0, 0, cam);
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
      stepEl.textContent = "step " + Math.max(0, Math.min(50, Math.round(step))) + " / 50";
      const k = Math.floor((s + 8.5) * 8) % 16;          // global time, so the sticker keeps its own 8 fps
      real.style.backgroundPosition = ((k % 4) * 100) / 3 + "% " + (Math.floor(k / 4) * 100) / 3 + "%";
    }
    const clock = { s: 0 };

    const tl = gsap.timeline({ paused: true });
    tl.fromTo(clock, { s: 0 }, { s: 7, duration: 7, ease: "none", onUpdate: () => renderAt(clock.s) }, 0);
    tl.fromTo("#how-l1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0.55);
    tl.fromTo("#how-eq", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.9);
    tl.to("#how-l1", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, 2.05);
    tl.fromTo(stepEl, { opacity: 0 }, { opacity: 1, duration: 0.2 }, 2.1);
    tl.fromTo("#how-l2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 2.25);
    tl.to(["#how-l2", "#how-eq"], { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, 5.3);
    tl.fromTo(real, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power4.out" }, 5.4);
    tl.to(stepEl, { opacity: 0, duration: 0.15 }, 5.4);
    tl.fromTo("#how-l3", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 5.45);
    renderAt(0);
    window.__timelines["how"] = tl;
  </script>
</template>
